<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudar Background</title>

    <style>
        body {
            text-align: center;
            margin-top: 100px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>cor</h1>
    <button onclick="mudarCor()">Mudar Cor de Fundo</button>

    <script>
        function mudarCor() {
            
            var r = Math.floor(Math.random() * 1000);
            var g = Math.floor(Math.random() * 1000);
            var b = Math.floor(Math.random() * 1000);
            while (r > 255 || g > 255 || b > 255) {
                var r = Math.floor(Math.random() * 1000);
                var g = Math.floor(Math.random() * 1000);
                var b = Math.floor(Math.random() * 1000);
            }
            const cor = `rgb(${r}, ${g}, ${b})`
            

            //const cor = '#' + Math.floor(Math.random() * 16777215).toString(16);

            document.querySelector("h1").textContent = cor
            document.body.style.backgroundColor = cor;
        }
    </script>
</body>
</html>
